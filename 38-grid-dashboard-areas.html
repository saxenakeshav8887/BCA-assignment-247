<!DOCTYPE html>
<html>
<head>
    <title>Grid Dashboard Areas</title>

    <style>
        body {
          font-family: Arial;
          background-color: lightgray;           margin: 0;
        }

        .dashboard {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            grid-template-columns: 200px 1fr;
            grid-template-rows: 70px 300px 50px;
            gap: 10px;
            padding: 10px;
        }

        .header {
            grid-area: header;
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 10px;
        }

        .sidebar {
          grid-area: sidebar;
          background-color: lightblue;
          padding: 20px;
        }

        .main {
            grid-area: main;
            background-color: white;
            padding: 20px;
        }

        .footer {
            grid-area: footer;
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <div class="header">
            <h2>Dashboard Header</h2>
        </div>

        <div class="sidebar">
            <h3>Sidebar</h3>
            <p>Home</p>
            <p>Profile</p>
            <p>Settings</p>
        </div>

        <div class="main">
          <h2>Main Content</h2>
          <p>Welcome to the Dashboard.</p>
        </div>

        <div class="footer">
            Dashboard Footer
        </div>

    </div>

</body>
</html>
