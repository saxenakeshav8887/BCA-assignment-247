<!DOCTYPE html>
<html>
<head>
    <title>Grid Header Sidebar Product</title>

    <style>
        body {
          font-family: Arial;
          margin: 0;
          background-color: lightgray;
        }

        .container {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar product";
            grid-template-columns: 200px 1fr;
            gap: 10px;
            padding: 10px;
        }

        .header {
            grid-area: header;
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .sidebar {
           grid-area: sidebar;
           background-color: lightblue;
           padding: 20px;
        }

        .product {
            grid-area: product;
            background-color: white;
            padding: 30px;
            text-align: center;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>My Shopping Website</h1>
        </header>

        <aside class="sidebar">
            <h2>Categories</h2>
            <p>Mobiles</p>
            <p>Laptops</p>
            <p>Headphones</p>
        </aside>

        <main class="product">
            <h2>Product Details</h2>
            <p>Product: Smartphone</p>
            <p>Price: ₹12000</p>
            <button>Buy Now</button>
        </main>

    </div>

</body>
</html>
