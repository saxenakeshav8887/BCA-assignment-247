<!DOCTYPE html>
<html>
<head>
    <title>Fix Overflow</title>

    <style>
        body {
          font-family: Arial;
          background-color: lightgray;
        }

        .box {
            width: 300px;
            height: 120px;
            background-color: white;
            border: 2px solid blue;
            padding: 10px;
            overflow: auto;
        }

        h1 {
            color: darkblue;
        }
    </style>
</head>

<body>

    <h1>Fix Overflow Example</h1>

    <div class="box">
        <p> CSS overflow property controls what happens when content is too large to fit inside an element.
The auto value adds scrollbars when required. This helps to display extra content properly.
        </p>
    </div>

</body>
</html>
