<!DOCTYPE html>
<html>
<head>
    <title>Size Chart Table</title>
</head>
<body>

    <h1>Clothing Size Chart</h1>

    <table border="1">

        <thead>
          <tr>
             <th>Size</th>
             <th>Chest</th>
             <th>Waist</th>
             <th>Length</th>
          </tr>
        </thead>

        <tbody>
            <tr>
              <td>Small</td>
              <td>36</td>
              <td>30</td>
              <td>26</td>
            </tr>

            <tr>
              <td>Medium</td>
              <td>38</td>
              <td>32</td>
              <td>27</td>
            </tr>

            <tr>
              <td>Large</td>
              <td>40</td>
              <td>34</td>
              <td>28</td>
            </tr>

            <tr>
              <td>XL</td>
              <td>42</td>
              <td>36</td>
              <td>29</td>
            </tr>
        </tbody>

        <tfoot>
           <tr>
             <td colspan="4">All measurements are in inches.</td>
           </tr>
        </tfoot>

    </table>

</body>
</html>
