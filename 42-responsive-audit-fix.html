<!DOCTYPE html>
<html>
<head>
    <title>Responsive Audit Fix</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
          font-family: Arial;
          margin: 0;
          background-color: lightgray;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .box {
           background-color: lightblue;
           padding: 20px;
           width: 50%;
           border: 2px solid blue;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Website</h1>

    <div class="container">

        <div class="box">
            <h2>Box 1</h2>
            <p>This is the first content box.</p>
        </div>

        <div class="box">
            <h2>Box 2</h2>
            <p>This is the second content box.</p>
        </div>

    </div>

</body>
</html>
