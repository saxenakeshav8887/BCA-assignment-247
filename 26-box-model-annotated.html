<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
        }

        .box {
            width: 250px;
            padding: 20px;
            border: 5px solid blue;
            margin: 30px;
            background-color: lightyellow;
        }

        h2 {
            color: darkblue;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        <h2>My Box</h2>
        <p>This is an example of CSS Box Model.</p>
    </div>

</body>
</html>
