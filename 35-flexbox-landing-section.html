<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Landing Section</title>

    <style>
        body {
          font-family: Arial;
          margin: 0;
          background-color: lightgray;
        }

        .landing {
           display: flex;
           justify-content: space-around;
            align-items: center;
            min-height: 400px;
            padding: 30px;
            background-color: lightblue;
        }

        .content {
            width: 45%;
        }

        h1 {
            color: darkblue;
        }

        p {
            font-size: 18px;
        }

        .image-box {
            width: 250px;
            height: 200px;
            background-color: white;
            border: 2px solid darkblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <section class="landing">

        <div class="content">
            <h1>Welcome to My Website</h1>
            <p>Learn new skills and explore the world of technology.</p>
            <button>Get Started</button>
        </div>

        <div class="image-box">
            <h2>Image Area</h2>
        </div>

    </section>

</body>
</html>
