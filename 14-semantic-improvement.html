<!DOCTYPE html>
<html>
<head>
   <title>Semantic HTML</title>
</head>
<body> 
  <header>
    <h1>My college website</h1>
    <p>Welcome to my college website </p>
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#courses">Courses</a>
  </nav>
   
  <main>
    <section id="home">
      <h2>Home</h2>
      <p>Welcome to our college</p>
    </section>

    <section id="about">
      <h2>About</h2>
      <p>Our college provide quality education</p>
    </section>

    <article id="courses">
      <h2>Courses</h2>
      <ul>
        <li>BCA</li>
        <li>BBA</li>
        <li>B.Com</li>
        <li>etc</li>
      </ul>
  </main>

  <footer>
    <p>Copyright 2026 my college</p>
  </footer>

</body>
</html>
