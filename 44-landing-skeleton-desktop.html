<!DOCTYPE html>
<html>
<head>
    <title>Landing Page Skeleton</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px 40px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 60px 40px;
            background-color: #f2f2f2;
        }

        .hero-content {
            width: 50%;
        }

        .hero-image {
            width: 40%;
            height: 250px;
            background-color: #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .features {
            display: flex;
            gap: 20px;
            padding: 40px;
        }

        .feature-box {
            flex: 1;
            padding: 25px;
            background-color: #e5e5e5;
            text-align: center;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <h2>My Website</h2>

            <div>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </div>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Welcome to Our Website</h1>
            <p>We create simple and useful web solutions.</p>
            <button>Get Started</button>
        </div>

        <div class="hero-image">
            Image Placeholder
        </div>
    </section>

    <section class="features">
        <div class="feature-box">
            <h3>Feature One</h3>
            <p>Simple and useful service.</p>
        </div>

        <div class="feature-box">
            <h3>Feature Two</h3>
            <p>Easy to use design.</p>
        </div>

        <div class="feature-box">
            <h3>Feature Three</h3>
            <p>Modern web experience.</p>
        </div>
    </section>

    <footer>
        <p>Copyright 2026 My Website</p>
    </footer>

</body>
</html>
