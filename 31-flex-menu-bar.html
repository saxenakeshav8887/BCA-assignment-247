<!DOCTYPE html>
<html>
<head>
    <title>Flex Menu Bar</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .navbar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: darkblue;
            padding: 15px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .navbar a:hover {
            color: yellow;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <h1>Welcome to My Website</h1>

    <p>This is an example of a Flex Menu Bar.</p>

</body>
</html>
