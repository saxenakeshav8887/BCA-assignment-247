<!DOCTYPE html>
<html>
<head>
    <title>Grid and Flex Landing Page</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
          margin: 0;
          font-family: Arial,sans-serif;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 50px;
            align-items: center;
        }

        .hero img {
            width: 100%;
            border-radius: 10px;
        }

        .hero button {
            background-color: blue;
            color: white;
            padding: 12px 20px;
            border: none;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .hero {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            nav {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <h2>My Website</h2>

            <div>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
        </nav>
    </header>

    <section class="hero">

        <div>
            <h1>Welcome to My Website</h1>
            <p>
                Learn web development and create
                beautiful responsive websites.
            </p>
            <button>Get Started</button>
        </div>

        <img src="https://placehold.co/600x350"
             alt="Website banner image">

    </section>

</body>
</html>
