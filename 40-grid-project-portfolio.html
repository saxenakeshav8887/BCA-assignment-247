<!DOCTYPE html>
<html>
<head>
    <title>Grid Project Portfolio</title>

    <style>
        body {
          font-family: Arial;
          margin: 0;
          background-color: lightgray;
          text-align: center;
        }

        h1 {
            color: darkblue;
            padding: 20px;
        }

        .portfolio {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .project {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px gray;
        }

        h2 {
            color: blue;
        }
    </style>
</head>

<body>

    <h1>My Project Portfolio</h1>

    <div class="portfolio">

        <div class="project">
            <h2>Project 1</h2>
            <p>Personal Website</p>
        </div>

        <div class="project">
            <h2>Project 2</h2>
            <p>Student Registration Form</p>
        </div>

        <div class="project">
            <h2>Project 3</h2>
            <p>Photo Gallery</p>
        </div>

        <div class="project">
            <h2>Project 4</h2>
            <p>Login Form</p>
        </div>

        <div class="project">
            <h2>Project 5</h2>
            <p>Product Cards</p>
        </div>

        <div class="project">
            <h2>Project 6</h2>
            <p>College Website</p>
        </div>

    </div>

</body>
</html>
