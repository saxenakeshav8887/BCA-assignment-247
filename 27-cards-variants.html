<!DOCTYPE html>
<html>
<head>
    <title>Card Variants</title>

    <style>
        body {
         font-family: Arial;
         background-color: lightgray;
         text-align: center;
        }

        .card {
            background-color: white;
            width: 250px;
            padding: 20px;
            margin: 20px auto;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }

        .card h2 {
            color: darkblue;
        }

        .card p {
            color: black;
        }

        .primary {
            border-top: 5px solid blue;
        }

        .success {
          border-top: 5px solid green;
        }

        .warning {
          border-top: 5px solid orange;
        }
    </style>
</head>

<body>

    <h1>Different Card Variants</h1>

    <div class="card primary">
        <h2>Primary Card</h2>
        <p>This is a primary card.</p>
    </div>

    <div class="card success">
        <h2>Success Card</h2>
        <p>This is a success card.</p>
    </div>

    <div class="card warning">
        <h2>Warning Card</h2>
        <p>This is a warning card.</p>
    </div>

</body>
</html>
