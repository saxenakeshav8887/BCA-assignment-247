<!DOCTYPE html>
<html>
<head>
    <title>Flex Centered Login</title>

    <style>
        body {
          font-family: Arial;
          background-color: lightgray;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          margin: 0;
        }

        .login-box {
            background-color: white;
            padding: 30px;
            width: 250px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Login Form</h2>

        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">

        <button>Login</button>
    </div>

</body>
</html>
