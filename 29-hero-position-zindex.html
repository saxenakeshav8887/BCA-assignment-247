<!DOCTYPE html>
<html>
<head>
    <title>Hero Position Z-Index</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .hero {
          position: relative;
          height: 300px;
          background-color: lightblue;
          text-align: center;
        }

        .content {
            position: absolute;
            top: 80px;
            left: 50px;
            z-index: 2;
        }

        .box {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 150px;
            height: 150px;
            background-color: orange;
            z-index: 1;
        }
    </style>
</head>

<body>

    <div class="hero">

        <div class="box"></div>

        <div class="content">
            <h1>Welcome to My Website</h1>
            <p>Learn HTML and CSS Easily.</p>
        </div>

    </div>

</body>
</html>
