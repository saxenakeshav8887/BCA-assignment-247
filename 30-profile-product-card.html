<!DOCTYPE html>
<html>
<head>
    <title>Profile Product Card</title>

    <style>
        body {
          font-family: Arial;
          background-color: lightgray;
          text-align: center;
        }

        .card {
            background-color: white;
            width: 250px;
            padding: 20px;
            margin: 20px auto;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }

        h2 {
            color: darkblue;
        }

        p {
            color: black;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>Profile and Product Cards</h1>

    <div class="card">
        <h2>Profile Card</h2>
        <p>Name: Student</p>
        <p>Course: BCA</p>
        <p>Skills: HTML, CSS, Java</p>
    </div>

    <div class="card">
        <h2>Product Card</h2>
        <p>Product: Headphones</p>
        <p>Price: ₹999</p>
        <button>Buy Now</button>
    </div>

</body>
</html>
