<!DOCTYPE html>
<html>
<head>
    <title>Selector Types</title>

    <style>
        /* Element Selector */
        h1 {
            color: blue;
        }

        /* ID Selector */
        #heading {
            color: green;
        }

        /* Class Selector */
        .para {
            color: red;
            font-size: 18px;
        }

        /* Universal Selector */
        * {
            font-family: Arial;
        }

        /* Group Selector */
        h2, p {
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>CSS Selectors</h1>

    <h2 id="heading">Welcome to HTML and CSS</h2>

    <p class="para">
        CSS selectors are used to select HTML elements.
    </p>

    <p> They help us apply styles to webpages.
    </p>

</body>
</html>
