<!DOCTYPE html>
<html>
<head>
    <title>Flex Navbar Hero</title>

    <style>
        body {
          font-family: Arial;
          margin: 0;
          background-color: lightgray;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: darkblue;
            padding: 15px 30px;
            color: white;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
            background-color: lightblue;
            text-align: center;
        }

        .hero h1 {
            color: darkblue;
        }

        .hero p {
            color: black;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 10px 20px;
            border: none;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <h2>My Website</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <section class="hero">
        <div>
            <h1>Welcome to My Website</h1>
            <p>Learn HTML and CSS Easily.</p>
            <button>Get Started</button>
        </div>
    </section>

</body>
</html>
